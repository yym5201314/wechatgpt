name: Build zhushou

# 触发条件：当你推送到 main/master 分支，或者手动点击运行按钮时触发
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build iOS Tweak
    runs-on: macos-latest 
    env:
      THEOS: ${{ github.workspace }}/theos 

    steps:
      - name: 📥 检出代码 (Checkout Repository)
        uses: actions/checkout@v4

      - name: 🧾 预设版本 Bump package version
        run: |
          VERSION_PREFIX="5.2.0"
          VERSION_BASE=0
          VERSION="${VERSION_PREFIX}-$((VERSION_BASE + ${{ github.run_number }}))"

          echo "Using version: $VERSION"
          sed -i '' "s/^Version: .*/Version: ${VERSION}/" control
          echo "PACKAGE_VERSION=${VERSION}" >> $GITHUB_ENV

      - name: ⚙️ 安装依赖 (Install Dependencies)
        run: |
          brew install ldid dpkg

      - name: 🛠️ 配置 Theos 环境 (Setup Roothide Theos)
        run: |
          echo "Cloning Roothide Theos fork..."
          git clone --recursive https://github.com/roothide/theos.git $THEOS

      - name: 📦 下载 iOS SDK (Setup iOS SDKs)
        run: |
          echo "Cloning iOS SDKs..."
          rm -rf $THEOS/sdks
          git clone https://github.com/theos/sdks.git $THEOS/sdks

      - name: 🧾 读取软件包版本
        run: |
          VERSION=$(awk -F': ' '/^Version:/ {print $2; exit}' control)
          echo "PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: 🚀 运行编译脚本 (Run build.sh)
        run: |
          chmod +x build.sh
          # 使用 sudo -E 提权执行
          sudo -E ./build.sh

      - name: ✅ 创建 Release
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'workflow_dispatch'
        #if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')  //手动触发时，不创建 Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: v${{ env.PACKAGE_VERSION }}
          name: zhushou v${{ env.PACKAGE_VERSION }}
          files: ${{ github.workspace }}/packages/*.deb
          overwrite_files: false
          fail_on_unmatched_files: true